name: Deploy to GitHub Pages

# Builds the Vite SPA and publishes it to GitHub Pages. No secrets required:
# configure-pages enables Pages on first run, GitHub's runners host the result.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /
          # Custom domain, NOT the *.workers.dev hostname. Free-hosting TLDs are
          # widely flagged by consumer security suites (Bitdefender blocked the
          # workers.dev fetch on 2026-07-31, surfacing as "Failed to fetch" in
          # the cart with no server-side fault). A checkout blocked by a
          # customer's AV fails silently and looks like a broken store.
          # Requires the Worker's Custom Domain to be configured first.
          VITE_CHECKOUT_ENDPOINT: https://checkout.berrova.com/create-checkout-session
        run: npm run build
      # 404.html must be the clean SPA shell, copied BEFORE prerender
      # overwrites dist/index.html with the rendered homepage.
      - name: SPA fallback copy
        run: cp dist/index.html dist/404.html
      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium
      # Prerenders the six public routes to real HTML files (fixes the SPA
      # 404-status + empty-shell SEO problem) and writes dist/sitemap.xml.
      - name: Prerender routes
        run: node scripts/prerender.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
