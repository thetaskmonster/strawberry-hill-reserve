# Cloudflare Worker config for the Berrova checkout endpoint.
#
# SECRETS ARE NOT STORED HERE. The Stripe secret key and the guard token are
# both set out of band with:
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put CHECKOUT_GUARD_TOKEN
# Only non-secret vars live in [vars]. CHECKOUT_GUARD_TOKEN in particular must
# NEVER be added to [vars] below: [vars] values are plaintext in wrangler.toml
# and in `wrangler deploy` output, which defeats the whole point of a secret
# shared-token guard.

name = "berrova-checkout"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Non-secret configuration. SITE_ORIGIN gates CORS and builds the return URLs.
# Override per environment as needed. No trailing slash.
[vars]
SITE_ORIGIN = "https://berrova.com"

# Local development reads secrets from .dev.vars (git-ignored). See
# .dev.vars.example for the variable names, including CHECKOUT_GUARD_TOKEN.
